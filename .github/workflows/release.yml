name: Release notes diagnostics

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version whose commit titles are being diagnosed
        type: string
        required: true

permissions:
  contents: read

jobs:
  notes-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2ae758bb31937a91df32e3e0289376535f2490d2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Diagnose the original generator without recording provider content
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
          RELEASE_NOTES_API_URL: ${{ vars.RELEASE_NOTES_API_URL }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, os, sys, time, traceback, urllib.error
          from pathlib import Path
          sys.path.insert(0, str(Path('tools/github').resolve()))
          import release_notes as notes

          def report_error(stage, error):
              seen = set()
              while error is not None and id(error) not in seen:
                  seen.add(id(error))
                  row = {'stage': stage, 'exception': type(error).__name__}
                  if isinstance(error, urllib.error.HTTPError):
                      row['httpStatus'] = error.code
                      body = error.read(8192).decode('utf-8', errors='replace').lower()
                      row['knownErrorTerms'] = [term for term in (
                          'response_format', 'max_tokens', 'stream', 'thinking',
                          'unauthorized', 'forbidden', 'quota', 'rate limit',
                          'not found', 'overload', 'model', 'api key', 'invalid') if term in body]
                  if isinstance(error, urllib.error.URLError):
                      row['transportReasonType'] = type(error.reason).__name__
                  row['locations'] = [f'{Path(frame.filename).name}:{frame.lineno}'
                                      for frame in traceback.extract_tb(error.__traceback__)]
                  print(json.dumps(row), flush=True)
                  error = error.__cause__ or error.__context__

          original_model = notes.model_notes
          def traced_model(*args, **kwargs):
              started = time.monotonic()
              key = os.environ.get('RELEASE_NOTES_API_KEY', '')
              print(json.dumps({'stage': 'model-start', 'commitCount': len(args[2]),
                  'keyPresent': bool(key), 'keyHasOuterWhitespace': key != key.strip()}), flush=True)
              try:
                  result = original_model(*args, **kwargs)
                  print(json.dumps({'stage': 'model-return', 'seconds': round(time.monotonic()-started, 2)}), flush=True)
                  return result
              except Exception as error:
                  print(json.dumps({'stage': 'model-failed', 'seconds': round(time.monotonic()-started, 2)}), flush=True)
                  report_error('model', error)
                  raise
          notes.model_notes = traced_model

          original_validate = notes.validate
          def traced_validate(*args, **kwargs):
              try:
                  return original_validate(*args, **kwargs)
              except Exception as error:
                  report_error('validation', error)
                  raise
          notes.validate = traced_validate
          ctx = {'schema': 1, 'component': 'client', 'version': os.environ['RELEASE_VERSION'],
                 'repository': os.environ['GITHUB_REPOSITORY'], 'commit': notes.git('rev-parse', 'HEAD'),
                 'runId': os.environ['GITHUB_RUN_ID']}
          output = Path('release-evidence/release-notes.json')
          record = notes.generate(ctx, output)
          print(json.dumps({'stage': 'complete', 'status': record.get('status', 'generated'),
              'items': {locale: sum(len(section['items']) for section in content['sections'])
                        for locale, content in record['locales'].items()}}), flush=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-diagnostic
          path: release-evidence/release-notes.json
          if-no-files-found: error
          retention-days: 7
